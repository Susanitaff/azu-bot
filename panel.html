<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Azu · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde-oscuro: #14532d;
    --verde: #1b7a43;
    --crema: #f7f5f0;
    --tinta: #21231f;
    --gris: #8b8f87;
    --borde: #e4e1d8;
    --blanco: #ffffff;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--crema); margin:0; color:var(--tinta); }
  h1, h2, .marca { font-family: "Space Grotesk", sans-serif; }

  #login { max-width:340px; margin:100px auto; text-align:center; background:var(--blanco); padding:36px 28px; border-radius:14px; border:1px solid var(--borde); }
  #login .marca { font-size:26px; font-weight:700; color:var(--verde-oscuro); margin-bottom:4px; }
  #login .subtitulo { color:var(--gris); font-size:13px; margin-bottom:24px; }
  input[type=password] { padding:10px 12px; width:100%; box-sizing:border-box; margin-bottom:12px; border:1px solid var(--borde); border-radius:8px; font-size:14px; }
  button { padding:10px 18px; background:var(--verde-oscuro); color:white; border:none; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; transition:background .15s; }
  button:hover { background:var(--verde); }
  #loginError { color:#b3261e; font-size:13px; min-height:16px; }

  #app { display:none; height:100vh; flex-direction:column; }
  .topbar { display:flex; align-items:center; justify-content:space-between; background:var(--verde-oscuro); color:white; padding:12px 20px; }
  .topbar .marca { font-size:18px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .topbar .marca .punto { width:8px; height:8px; border-radius:50%; background:#7ee89a; display:inline-block; }
  .tabs { display:flex; gap:4px; }
  .tab { padding:8px 16px; color:rgba(255,255,255,0.75); cursor:pointer; border-radius:6px; font-size:13px; font-weight:600; }
  .tab.activo { color:white; background:rgba(255,255,255,0.15); }
  .tab:hover { color:white; }

  .layout { display:flex; flex:1; min-height:0; }

  .col-lista { width:330px; background:var(--blanco); border-right:1px solid var(--borde); overflow-y:auto; padding:14px; }
  .col-lista h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--gris); margin:0 0 12px 4px; }
  .chat-card { background:var(--crema); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; border-left:4px solid var(--borde); transition:transform .1s; }
  .chat-card:hover { transform:translateX(2px); }
  .chat-card.selected { background:#eaf3ec; border-left-color:var(--verde-oscuro); }
  .chat-card.estado-esperando_asesor { border-left-color:#c98a00; }
  .chat-card.estado-revisar_pago { border-left-color:#1868a8; }
  .chat-card.estado-atendido { border-left-color:var(--verde); }
  .telefono { font-weight:600; font-size:14px; }
  .estado { display:inline-block; padding:2px 9px; border-radius:20px; font-size:10px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; margin-left:6px; vertical-align:middle; }
  .estado-bot { background:#e7e5df; color:#6b6d66; }
  .estado-esperando_asesor { background:#fbe7ae; color:#7a5400; }
  .estado-atendido { background:#cdeada; color:#14532d; }
  .estado-revisar_pago { background:#cfe4f5; color:#0d3f66; }
  .ultima-actividad { font-size:11px; color:var(--gris); margin-top:4px; }

  .col-chat { flex:1; display:flex; flex-direction:column; padding:18px 22px; min-width:0; }
  .chat-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .chat-header h2 { margin:0; font-size:16px; }
  .vacio { color:var(--gris); text-align:center; margin-top:80px; font-size:14px; }
  .vacio .icono { font-size:32px; display:block; margin-bottom:10px; }

  .mensajes { flex:1; overflow-y:auto; background:var(--blanco); border-radius:12px; padding:16px; margin-bottom:10px; border:1px solid var(--borde); }
  .msg-fila { display:flex; margin-bottom:10px; }
  .msg-fila.saliente { justify-content:flex-end; }
  .msg { max-width:65%; padding:9px 13px; border-radius:12px; font-size:14px; line-height:1.4; }
  .msg.entrante { background:#f0efe9; border-bottom-left-radius:3px; }
  .msg.saliente { background:#d7f0dd; border-bottom-right-radius:3px; }
  .msg-hora { font-size:10px; color:var(--gris); margin-top:3px; text-align:right; }

  .responder { display:flex; gap:8px; }
  .responder input { flex:1; padding:10px 12px; border:1px solid var(--borde); border-radius:8px; font-size:14px; }
  .responder button:disabled { background:#c7c5bd; cursor:not-allowed; }
  .aviso-bloqueado { color:var(--gris); font-size:12px; margin-top:6px; }
  .btn-finalizar { background:transparent; color:#8b3a3a; border:1px solid #e2b8b8; margin-top:10px; font-weight:600; }
  .btn-finalizar:hover { background:#fbeaea; }

  #vistaConfiguracion { display:none; padding:24px; overflow-y:auto; }
  .config-seccion { max-width:640px; margin-bottom:32px; }
  .config-seccion h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--gris); margin-bottom:12px; }
  .tarjeta { background:var(--blanco); border:1px solid var(--borde); border-radius:12px; padding:16px; margin-bottom:12px; }
  .tarjeta label { display:block; font-size:12px; font-weight:600; color:var(--gris); margin-bottom:6px; }
  .tarjeta input[type=text], .tarjeta input[type=number], .tarjeta textarea {
    width:100%; padding:9px 11px; border:1px solid var(--borde); border-radius:8px; font-size:14px; font-family:inherit; margin-bottom:10px;
  }
  .campo-ajuste { margin-bottom:16px; }
  .campo-ajuste:last-child { margin-bottom:0; }
  .opcion-card.inactiva { opacity:.5; }
  .opcion-disparador { font-family:"Space Grotesk", sans-serif; font-weight:700; color:var(--verde-oscuro); font-size:15px; }
  .opcion-tipo { font-size:11px; color:var(--gris); margin-left:6px; }
  .opcion-acciones { display:flex; gap:8px; margin-top:10px; }
  .opcion-acciones button.secundario { background:transparent; color:var(--tinta); border:1px solid var(--borde); }
  .opcion-acciones button.secundario:hover { background:var(--crema); }
</style>
</head>
<body>
  <div id="login">
    <div class="marca">Azu</div>
    <div class="subtitulo">Panel · Club Atlético Carlos Paz</div>
    <input type="password" id="clave" placeholder="Contraseña" />
    <button onclick="entrar()" style="width:100%;">Entrar</button>
    <p id="loginError"></p>
  </div>

  <div id="app">
    <div class="topbar">
      <div class="marca"><span class="punto"></span>Azu</div>
      <div class="tabs">
        <div class="tab activo" id="tabConversaciones" onclick="cambiarTab('conversaciones')">Conversaciones</div>
        <div class="tab" id="tabConfiguracion" onclick="cambiarTab('configuracion')">Configuración</div>
      </div>
    </div>

    <div class="layout" id="vistaConversaciones">
      <div class="col-lista">
        <h2>Conversaciones</h2>
        <div id="chats"></div>
      </div>
      <div class="col-chat">
        <div id="sinSeleccion" class="vacio"><span class="icono">💬</span>Elegí una conversación de la izquierda</div>
        <div id="chatSeleccionado" style="display:none; flex:1; flex-direction:column;">
          <div class="chat-header"><h2 id="telefonoSeleccionado"></h2></div>
          <div class="mensajes" id="mensajes"></div>
          <div class="responder">
            <input type="text" id="textoRespuesta" placeholder="Escribí una respuesta..." />
            <button id="btnResponder" onclick="responder()">Enviar</button>
          </div>
          <div class="aviso-bloqueado" id="avisoBloqueado"></div>
          <button class="btn-finalizar" onclick="finalizarChat()">Finalizar chat y devolver a Azu</button>
        </div>
      </div>
    </div>

    <div id="vistaConfiguracion">
      <div class="config-seccion">
        <h2>Mensajes generales</h2>
        <div class="tarjeta">
          <div class="campo-ajuste">
            <label>Mensaje de bienvenida</label>
            <textarea id="cfgBienvenida" rows="2"></textarea>
          </div>
          <div class="campo-ajuste">
            <label>Mensaje al recibir un comprobante</label>
            <textarea id="cfgComprobante" rows="2"></textarea>
          </div>
          <div class="campo-ajuste">
            <label>Mensaje de despedida (al finalizar un chat)</label>
            <textarea id="cfgDespedida" rows="2"></textarea>
          </div>
          <div class="campo-ajuste">
            <label>Minutos sin respuesta del asesor antes de devolver el chat a Azu</label>
            <input type="number" id="cfgTimeout" min="1" style="max-width:120px;" />
          </div>
          <button onclick="guardarConfiguracionGeneral()">Guardar mensajes</button>
        </div>
      </div>

      <div class="config-seccion">
        <h2>Opciones y palabras clave</h2>
        <div class="tarjeta">
          <label>Disparador (número o palabra clave, ej: "4" o "cuotas")</label>
          <input type="text" id="nuevoDisparador" />
          <label>Respuesta</label>
          <textarea id="nuevoContenido" rows="3"></textarea>
          <button onclick="crearOpcion()">Agregar opción</button>
        </div>
        <div id="listaOpciones"></div>
      </div>
    </div>
  </div>

<script>
  let clave = "";
  let conversacionActual = null;
  let estadoActual = "";

  async function entrar() {
    clave = document.getElementById('clave').value;
    const resp = await fetch('/api/conversaciones?password=' + encodeURIComponent(clave));
    if (!resp.ok) {
      document.getElementById('loginError').innerText = 'Contraseña incorrecta';
      return;
    }
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    cargarLista();
    setInterval(cargarLista, 5000);
    setInterval(() => { if (conversacionActual) cargarMensajes(); }, 5000);
  }

  function cambiarTab(tab) {
    document.getElementById('vistaConversaciones').style.display = tab === 'conversaciones' ? 'flex' : 'none';
    document.getElementById('vistaConfiguracion').style.display = tab === 'configuracion' ? 'block' : 'none';
    document.getElementById('tabConversaciones').className = 'tab' + (tab === 'conversaciones' ? ' activo' : '');
    document.getElementById('tabConfiguracion').className = 'tab' + (tab === 'configuracion' ? ' activo' : '');
    if (tab === 'configuracion') { cargarOpciones(); cargarConfiguracionGeneral(); }
  }

  async function cargarLista() {
    const resp = await fetch('/api/conversaciones?password=' + encodeURIComponent(clave));
    const datos = await resp.json();
    const cont = document.getElementById('chats');
    cont.innerHTML = '';
    datos.forEach(c => {
      const div = document.createElement('div');
      div.className = 'chat-card estado-' + c.estado + (conversacionActual === c.id ? ' selected' : '');
      div.onclick = () => seleccionar(c.id, c.telefono, c.estado);
      div.innerHTML = `<span class="telefono">${c.telefono}</span>
        <span class="estado estado-${c.estado}">${c.estado.replace('_',' ')}</span>
        <div class="ultima-actividad">${new Date(c.ultima_actividad).toLocaleString('es-AR')}</div>`;
      cont.appendChild(div);
    });
  }

  function seleccionar(id, telefono, estado) {
    conversacionActual = id;
    estadoActual = estado;
    document.getElementById('sinSeleccion').style.display = 'none';
    document.getElementById('chatSeleccionado').style.display = 'flex';
    document.getElementById('telefonoSeleccionado').innerText = telefono;
    document.getElementById('textoRespuesta').dataset.telefono = telefono;
    actualizarBloqueo();
    cargarMensajes();
    cargarLista();
  }

  function actualizarBloqueo() {
    const input = document.getElementById('textoRespuesta');
    const btn = document.getElementById('btnResponder');
    const aviso = document.getElementById('avisoBloqueado');
    if (estadoActual === 'bot') {
      input.disabled = true;
      btn.disabled = true;
      aviso.innerText = 'Azu está atendiendo este chat sola. Se habilita cuando el socio pide hablar con una persona.';
    } else {
      input.disabled = false;
      btn.disabled = false;
      aviso.innerText = '';
    }
  }

  async function cargarMensajes() {
    if (!conversacionActual) return;
    const resp = await fetch(`/api/mensajes?password=${encodeURIComponent(clave)}&conversacion_id=${conversacionActual}`);
    const datos = await resp.json();
    const cont = document.getElementById('mensajes');
    cont.innerHTML = '';
    if (!Array.isArray(datos)) {
      cont.innerHTML = '<p style="color:#b3261e;">[Respuesta inesperada del servidor] ' + JSON.stringify(datos) + '</p>';
      return;
    }
    datos.forEach(m => {
      const fila = document.createElement('div');
      const direccion = m.direccion || 'entrante';
      fila.className = 'msg-fila ' + direccion;
      const hora = m.creado_en ? new Date(m.creado_en).toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' }) : '';
      const contenidoMostrar = (m.contenido !== undefined && m.contenido !== null) ? m.contenido : ('[dato inesperado] ' + JSON.stringify(m));
      fila.innerHTML = `<div>
        <div class="msg ${direccion}">${contenidoMostrar}</div>
        <div class="msg-hora">${hora}</div>
      </div>`;
      cont.appendChild(fila);
    });
    cont.scrollTop = cont.scrollHeight;
  }

  async function responder() {
    const input = document.getElementById('textoRespuesta');
    const texto = input.value.trim();
    if (!texto || !conversacionActual) return;
    const telefono = input.dataset.telefono;

    await fetch(`/api/mensajes?password=${encodeURIComponent(clave)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversacion_id: conversacionActual, telefono, texto }),
    });

    input.value = '';
    estadoActual = 'atendido';
    actualizarBloqueo();
    cargarMensajes();
    cargarLista();
  }

  async function finalizarChat() {
    if (!conversacionActual) return;
    if (!confirm('¿Finalizar este chat y devolverlo a Azu?')) return;
    await fetch('/api/conversaciones?password=' + encodeURIComponent(clave), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: conversacionActual }),
    });
    estadoActual = 'bot';
    actualizarBloqueo();
    cargarLista();
  }

  async function cargarOpciones() {
    const resp = await fetch('/api/opciones?password=' + encodeURIComponent(clave));
    const datos = await resp.json();
    const cont = document.getElementById('listaOpciones');
    cont.innerHTML = '';
    datos.forEach(o => {
      const div = document.createElement('div');
      div.className = 'tarjeta opcion-card' + (o.activo ? '' : ' inactiva');
      div.innerHTML = `
        <span class="opcion-disparador">${o.disparador}</span><span class="opcion-tipo">${o.tipo_respuesta}</span>
        <textarea rows="3" data-id="${o.id}">${o.contenido}</textarea>
        <div class="opcion-acciones">
          <button onclick="guardarOpcion('${o.id}', this)">Guardar cambios</button>
          <button class="secundario" onclick="toggleOpcion('${o.id}', ${!o.activo})">${o.activo ? 'Desactivar' : 'Activar'}</button>
        </div>`;
      cont.appendChild(div);
    });
  }

  async function guardarOpcion(id, boton) {
    const textarea = boton.closest('.opcion-card').querySelector('textarea');
    await fetch('/api/opciones?password=' + encodeURIComponent(clave), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, contenido: textarea.value }),
    });
    cargarOpciones();
  }

  async function toggleOpcion(id, nuevoValor) {
    await fetch('/api/opciones?password=' + encodeURIComponent(clave), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, activo: nuevoValor }),
    });
    cargarOpciones();
  }

  async function crearOpcion() {
    const disparador = document.getElementById('nuevoDisparador').value.trim();
    const contenido = document.getElementById('nuevoContenido').value.trim();
    if (!disparador || !contenido) return;
    await fetch('/api/opciones?password=' + encodeURIComponent(clave), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ disparador, contenido }),
    });
    document.getElementById('nuevoDisparador').value = '';
    document.getElementById('nuevoContenido').value = '';
    cargarOpciones();
  }

  async function cargarConfiguracionGeneral() {
    const resp = await fetch('/api/configuracion?password=' + encodeURIComponent(clave));
    const datos = await resp.json();
    const mapa = {};
    datos.forEach(d => mapa[d.clave] = d.valor);
    document.getElementById('cfgBienvenida').value = mapa.mensaje_bienvenida || '';
    document.getElementById('cfgComprobante').value = mapa.mensaje_comprobante || '';
    document.getElementById('cfgDespedida').value = mapa.mensaje_despedida || '';
    document.getElementById('cfgTimeout').value = mapa.timeout_minutos || '120';
  }

  async function guardarConfiguracionGeneral() {
    const cambios = [
      ['mensaje_bienvenida', document.getElementById('cfgBienvenida').value],
      ['mensaje_comprobante', document.getElementById('cfgComprobante').value],
      ['mensaje_despedida', document.getElementById('cfgDespedida').value],
      ['timeout_minutos', document.getElementById('cfgTimeout').value],
    ];
    for (const [clave2, valor] of cambios) {
      await fetch('/api/configuracion?password=' + encodeURIComponent(clave), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clave: clave2, valor }),
      });
    }
    alert('Mensajes guardados');
  }
</script>
</body>
</html>
