<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Panel de Azu</title>
<style>
  body { font-family: sans-serif; background:#f0f2f5; margin:0; padding:0; }
  h1 { color:#1b5e20; margin:0 0 12px 0; font-size:20px; }
  #login { max-width:300px; margin:60px auto; text-align:center; }
  input[type=password] { padding:8px; width:100%; box-sizing:border-box; margin-bottom:10px; }
  button { padding:8px 16px; background:#1b5e20; color:white; border:none; border-radius:4px; cursor:pointer; }
  #app { display:none; height:100vh; flex-direction:column; }
  .tabs { display:flex; background:#1b5e20; }
  .tab { padding:12px 20px; color:white; cursor:pointer; opacity:0.7; }
  .tab.activo { opacity:1; border-bottom:3px solid white; font-weight:bold; }
  .layout { display:flex; flex:1; min-height:0; }
  .col-lista { width:320px; background:white; border-right:1px solid #ddd; overflow-y:auto; padding:12px; box-sizing:border-box; }
  .col-chat { flex:1; display:flex; flex-direction:column; padding:12px; box-sizing:border-box; }
  .chat-card { background:#fafafa; border-radius:8px; padding:10px; margin-bottom:8px; cursor:pointer; border:2px solid transparent; }
  .chat-card:hover { background:#f0f0f0; }
  .chat-card.selected { border-color:#1b5e20; }
  .telefono { font-weight:bold; }
  .estado { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; margin-left:6px; }
  .estado-bot { background:#e0e0e0; color:#555; }
  .estado-esperando_asesor { background:#fff59d; color:#7a5c00; font-weight:bold; }
  .estado-atendido { background:#c8e6c9; color:#1b5e20; }
  .estado-revisar_pago { background:#bbdefb; color:#0d47a1; font-weight:bold; }
  .mensajes { flex:1; overflow-y:auto; background:white; border-radius:8px; padding:12px; margin-bottom:8px; }
  .msg { max-width:70%; padding:8px 12px; border-radius:8px; margin-bottom:8px; clear:both; }
  .msg.entrante { background:#e0e0e0; float:left; }
  .msg.saliente { background:#c8e6c9; float:right; }
  .responder { display:flex; gap:8px; }
  .responder input { flex:1; padding:8px; }
  .responder button:disabled { background:#aaa; cursor:not-allowed; }
  .aviso-bloqueado { color:#888; font-size:13px; margin-top:6px; }
  .vacio { color:#999; text-align:center; margin-top:40px; }
  .btn-finalizar { background:#888; margin-top:8px; }
  #vistaConfiguracion { display:none; padding:20px; overflow-y:auto; }
  .opcion-card { background:white; border-radius:8px; padding:12px; margin-bottom:10px; max-width:600px; }
  .opcion-card.inactiva { opacity:0.5; }
  .opcion-disparador { font-weight:bold; color:#1b5e20; }
  .opcion-card textarea { width:100%; box-sizing:border-box; padding:8px; margin-top:6px; font-family:inherit; }
  .opcion-acciones { display:flex; gap:8px; margin-top:8px; }
  .opcion-acciones button.secundario { background:#888; }
  .nueva-opcion { background:white; border-radius:8px; padding:12px; max-width:600px; margin-bottom:20px; }
  .nueva-opcion input, .nueva-opcion textarea { width:100%; box-sizing:border-box; padding:8px; margin-top:6px; margin-bottom:8px; font-family:inherit; }
</style>
</head>
<body>
  <div id="login">
    <h1>Panel de Azu</h1>
    <input type="password" id="clave" placeholder="Contraseña" />
    <button onclick="entrar()">Entrar</button>
    <p id="loginError" style="color:red;"></p>
  </div>

  <div id="app">
    <div class="tabs">
      <div class="tab activo" id="tabConversaciones" onclick="cambiarTab('conversaciones')">Conversaciones</div>
      <div class="tab" id="tabConfiguracion" onclick="cambiarTab('configuracion')">Configuración</div>
    </div>

    <div class="layout" id="vistaConversaciones">
      <div class="col-lista">
        <h1>Conversaciones</h1>
        <div id="chats"></div>
      </div>
      <div class="col-chat">
        <div id="sinSeleccion" class="vacio">Elegí una conversación de la izquierda</div>
        <div id="chatSeleccionado" style="display:none; flex:1; flex-direction:column;">
          <h1 id="telefonoSeleccionado"></h1>
          <div class="mensajes" id="mensajes"></div>
          <div class="responder">
            <input type="text" id="textoRespuesta" placeholder="Escribí una respuesta..." />
            <button id="btnResponder" onclick="responder()">Enviar</button>
          </div>
          <div class="aviso-bloqueado" id="avisoBloqueado"></div>
          <button class="btn-finalizar" onclick="finalizarChat()">Finalizar chat (devolver a Azu)</button>
        </div>
      </div>
    </div>

    <div id="vistaConfiguracion">
      <h1>Nueva opción</h1>
      <div class="nueva-opcion">
        <label>Disparador (número o palabra clave, ej: "4" o "cuotas")</label>
        <input type="text" id="nuevoDisparador" />
        <label>Respuesta</label>
        <textarea id="nuevoContenido" rows="3"></textarea>
        <button onclick="crearOpcion()">Agregar</button>
      </div>
      <h1>Opciones actuales</h1>
      <div id="listaOpciones"></div>
    </div>
  </div>

<script>
  let clave = "";
  let conversacionActual = null;
  let estadoActual = "";

  async function entrar() {
    clave = document.getElementById('clave').value;
    const resp = await fetch('/api/conversaciones?password=' + encodeURIComponent(clave));
    if (!resp.ok) {
      document.getElementById('loginError').innerText = 'Contraseña incorrecta';
      return;
    }
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    cargarLista();
    setInterval(cargarLista, 5000);
    setInterval(() => { if (conversacionActual) cargarMensajes(); }, 5000);
  }

  function cambiarTab(tab) {
    document.getElementById('vistaConversaciones').style.display = tab === 'conversaciones' ? 'flex' : 'none';
    document.getElementById('vistaConfiguracion').style.display = tab === 'configuracion' ? 'block' : 'none';
    document.getElementById('tabConversaciones').className = 'tab' + (tab === 'conversaciones' ? ' activo' : '');
    document.getElementById('tabConfiguracion').className = 'tab' + (tab === 'configuracion' ? ' activo' : '');
    if (tab === 'configuracion') cargarOpciones();
  }

  async function cargarLista() {
    const resp = await fetch('/api/conversaciones?password=' + encodeURIComponent(clave));
    const datos = await resp.json();
    const cont = document.getElementById('chats');
    cont.innerHTML = '';
    datos.forEach(c => {
      const div = document.createElement('div');
      div.className = 'chat-card' + (conversacionActual === c.id ? ' selected' : '');
      div.onclick = () => seleccionar(c.id, c.telefono, c.estado);
      div.innerHTML = `<span class="telefono">${c.telefono}</span>
        <span class="estado estado-${c.estado}">${c.estado}</span>
        <div style="font-size:11px;color:#888;">${new Date(c.ultima_actividad).toLocaleString('es-AR')}</div>`;
      cont.appendChild(div);
    });
  }

  function seleccionar(id, telefono, estado) {
    conversacionActual = id;
    estadoActual = estado;
    document.getElementById('sinSeleccion').style.display = 'none';
    document.getElementById('chatSeleccionado').style.display = 'flex';
    document.getElementById('telefonoSeleccionado').innerText = telefono;
    document.getElementById('textoRespuesta').dataset.telefono = telefono;
    actualizarBloqueo();
    cargarMensajes();
    cargarLista();
  }

  function actualizarBloqueo() {
    const input = document.getElementById('textoRespuesta');
    const btn = document.getElementById('btnResponder');
    const aviso = document.getElementById('avisoBloqueado');
    if (estadoActual === 'bot') {
      input.disabled = true;
      btn.disabled = true;
      aviso.innerText = 'Azu está atendiendo este chat sola. Se habilita cuando el socio pide hablar con una persona.';
    } else {
      input.disabled = false;
      btn.disabled = false;
      aviso.innerText = '';
    }
  }

  async function cargarMensajes() {
    if (!conversacionActual) return;
    const resp = await fetch(`/api/mensajes?password=${encodeURIComponent(clave)}&conversacion_id=${conversacionActual}`);
    const datos = await resp.json();
    const cont = document.getElementById('mensajes');
    cont.innerHTML = '';
    datos.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.direccion;
      div.innerText = m.contenido;
      cont.appendChild(div);
    });
    cont.scrollTop = cont.scrollHeight;
  }

  async function responder() {
    const input = document.getElementById('textoRespuesta');
    const texto = input.value.trim();
    if (!texto || !conversacionActual) return;
    const telefono = input.dataset.telefono;

    await fetch(`/api/mensajes?password=${encodeURIComponent(clave)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversacion_id: conversacionActual, telefono, texto }),
    });

    input.value = '';
    estadoActual = 'atendido';
    actualizarBloqueo();
    cargarMensajes();
    cargarLista();
  }

  async function finalizarChat() {
    if (!conversacionActual) return;
    if (!confirm('¿Finalizar este chat y devolverlo a Azu?')) return;
    await fetch('/api/conversaciones?password=' + encodeURIComponent(clave), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: conversacionActual }),
    });
    estadoActual = 'bot';
    actualizarBloqueo();
    cargarLista();
  }

  async function cargarOpciones() {
    const resp = await fetch('/api/opciones?password=' + encodeURIComponent(clave));
    const datos = await resp.json();
    const cont = document.getElementById('listaOpciones');
    cont.innerHTML = '';
    datos.forEach(o => {
      const div = document.createElement('div');
      div.className = 'opcion-card' + (o.activo ? '' : ' inactiva');
      div.innerHTML = `
        <span class="opcion-disparador">${o.disparador}</span> (${o.tipo_respuesta})
        <textarea rows="3" data-id="${o.id}">${o.contenido}</textarea>
        <div class="opcion-acciones">
          <button onclick="guardarOpcion('${o.id}', this)">Guardar cambios</button>
          <button class="secundario" onclick="toggleOpcion('${o.id}', ${!o.activo})">${o.activo ? 'Desactivar' : 'Activar'}</button>
        </div>`;
      cont.appendChild(div);
    });
  }

  async function guardarOpcion(id, boton) {
    const textarea = boton.closest('.opcion-card').querySelector('textarea');
    await fetch('/api/opciones?password=' + encodeURIComponent(clave), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, contenido: textarea.value }),
    });
    cargarOpciones();
  }

  async function toggleOpcion(id, nuevoValor) {
    await fetch('/api/opciones?password=' + encodeURIComponent(clave), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, activo: nuevoValor }),
    });
    cargarOpciones();
  }

  async function crearOpcion() {
    const disparador = document.getElementById('nuevoDisparador').value.trim();
    const contenido = document.getElementById('nuevoContenido').value.trim();
    if (!disparador || !contenido) return;
    await fetch('/api/opciones?password=' + encodeURIComponent(clave), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ disparador, contenido }),
    });
    document.getElementById('nuevoDisparador').value = '';
    document.getElementById('nuevoContenido').value = '';
    cargarOpciones();
  }
</script>
</body>
</html>
